[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lungtwin"
version = "0.1.0"
description = "Identifiability analysis for a low-dimensional IPF digital twin"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
lungtwin-ident = "lungtwin.cli:main"

[tool.setuptools.packages.find]
include = ["lungtwin*"]

[tool.ruff]
line-length = 88
