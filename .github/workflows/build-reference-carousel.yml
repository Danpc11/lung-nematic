name: Build reference-frame carousel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gif:
    name: Generate animated reference frames
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify reference frames
        run: |
          test -f assets/01_healthy_day0_labeled_en.png
          test -f assets/01a_initial_epithelial_stress_month2_labeled_en.png
          test -f assets/01b_evolving_epithelial_injury_month4_labeled_en.png
          test -f assets/02_early_injury_month6_labeled_en.png
          test -f assets/02a_progressive_injury_month7_labeled_en.png
          test -f assets/02b_derecruitment_month8_labeled_en.png
          test -f assets/02c_partial_collapse_month9_labeled_en.png
          test -f assets/02d_propagated_collapse_month10_labeled_en.png
          test -f assets/02e_near_complete_collapse_month11_labeled_en.png
          test -f assets/03_collapse_year1_labeled_en.png
          test -f assets/03a_fibroblast_recruitment_month13_labeled_en.png
          test -f assets/03b_myofibroblast_expansion_month14_labeled_en.png
          test -f assets/03c_early_matrix_deposition_month15_labeled_en.png
          test -f assets/03d_organizing_focus_month16_labeled_en.png
          test -f assets/03e_maturing_focus_month17_labeled_en.png
          test -f assets/04_focus_year1_5_labeled_en.png
          test -f assets/05_focus_year2_labeled_en.png

      - name: Build animated GIF
        run: |
          ffmpeg -y \
            -framerate 0.25 \
            -pattern_type glob \
            -i 'assets/0*_labeled_en.png' \
            -filter_complex \
            "[0:v]scale=1200:-2:flags=lanczos,split[a][b];[a]palettegen=max_colors=192[p];[b][p]paletteuse=dither=bayer" \
            -loop 0 \
            assets/reference_frames.gif

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/reference_frames.gif

          if git diff --cached --quiet; then
            echo "The GIF is already up to date."
          else
            git commit -m "Add animated reference-frame carousel"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
