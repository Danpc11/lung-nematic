name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run test suite
        run: pytest -q

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel
          pip install dist/*.whl
      - name: Import every packaged entry point
        run: |
          cd "$(mktemp -d)"
          python -c "import lung_nematic"
          python -c "import lung_nematic.synthetic"
          python -c "import simulations.alveolar"
          python -c "import simulations.alveolar3d"
          python -c "import simulations.fibrofocus"
          python -c "import simulations.coupled_analysis"
          python -c "import simulations.stereology"
          python -c "import simulations.focus3d"
          # lungtwin was previously a nested project whose modules never
          # reached the root wheel, while `lungtwin/` at the repo root
          # resolved as an empty namespace package. Both failures were
          # invisible to a job that only imported lung_nematic.
          python -c "import lungtwin"
          python -c "import lungtwin.model"
          python -c "import lungtwin.identifiability"

      - name: Run every console script
        # An entry point can be declared, installed, and still be broken. These
        # run from a temp dir so the checkout cannot supply the module.
        run: |
          cd "$(mktemp -d)"
          lung-nematic --help > /dev/null
          lungtwin-ident --help > /dev/null
          lungtwin-ident --visits 4 --treatment-start-months 6 > /dev/null

lint:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install package and lint dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m pip install ruff==0.16.0

    - name: Root scripts respond to --help
      run: |
        python run_timelapse.py --help > /dev/null
        python run_crossmap.py --help > /dev/null
        python run_flow_maps.py --help > /dev/null

    - name: Ruff
  run: ruff check lung_nematic lungtwin simulations tests *.py
      
  notebooks:
    # A malformed notebook (collapsed source, invalid schema) is invisible until
    # someone opens it in Colab. nbformat.validate catches it in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install nbformat
      - name: Validate notebooks
        run: |
          python - <<'PY'
          import glob, sys
          import nbformat
          failed = False
          for path in glob.glob("*.ipynb"):
              try:
                  nbformat.validate(nbformat.read(path, as_version=4))
                  print(f"ok   {path}")
              except Exception as error:
                  print(f"FAIL {path}: {error}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
